spring:
  application:
    name: know-base
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch-size: 100


  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  threads:
    virtual:
      enabled: true

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000

logging:
  level:
    org:
      springframework:
        security: DEBUG
know-base:
  storage:
    local:
      path: ${STORAGE_PATH}
