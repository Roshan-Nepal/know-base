databaseChangeLog:
  - changeSet:
      id: 1-create-documents-table
      author: Roshan Nepal
      changes:
        - createTable:
            tableName: documents
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_documents
                    nullable: false

              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: storage
                  type: varchar(255)

              - column:
                  name: type
                  type: varchar(50)
                  constraints:
                    nullable: false

              - column:
                  name: file_size
                  type: bigint

              - column:
                  name: language
                  type: varchar(50)

              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false

              - column:
                  name: meta_data
                  type: jsonb

              - column:
                  name: created_by
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp

              - column:
                  name: updated_by
                  type: varchar(255)

              - column:
                  name: updated_at
                  type: timestamp