databaseChangeLog:
  - changeSet:
      id: 1-create-document-contents
      author: Roshan Nepal
      changes:
        - createTable:
            tableName: document_contents
            columns:
              - column:
                  name: document_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_document_contents
                    nullable: false

              - column:
                  name: content
                  type: text
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: document_contents
            baseColumnNames: document_id
            referencedTableName: documents
            referencedColumnNames: id
            constraintName: fk_document_contents_document
            onDelete: CASCADE