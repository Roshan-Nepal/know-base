databaseChangeLog:
  - changeSet:
      id: 001-create-chunks
      author: Roshan Nepal
      comment: Document chunks for RAG retrieval
      changes:
        - createTable:
            tableName: document_chunks
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: document_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_chunk_doc
                    references: documents(id)
                    deleteCascade: true
              - column:
                  name: chunk_index
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: token_count
                  type: INTEGER
              - column:
                  name: start_char_pos
                  type: INTEGER
              - column:
                  name: end_char_pos
                  type: INTEGER
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()