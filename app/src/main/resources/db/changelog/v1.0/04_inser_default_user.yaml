databaseChangeLog:

  - changeSet:
      id: seed-admin-user
      author: Roshan Nepal

      changes:

        - insert:
            tableName: users
            columns:
              - column:
                  name: id
                  valueComputed: gen_random_uuid()

              - column:
                  name: username
                  value: admin

              - column:
                  name: email
                  value: admin@knowbase.com

              - column:
                  name: password
                  value: $2b$12$yhXHJfN.l2W8LEAVu.qiye3sXpj21s7gADaDU27qxUaHLU7J3B6Vu

        - sql:
            sql: |
              INSERT INTO user_roles (user_id, role_id)
              SELECT u.id, r.id
              FROM users u
              JOIN roles r ON r.name = 'ROLE_ADMIN'
              WHERE u.username = 'admin';