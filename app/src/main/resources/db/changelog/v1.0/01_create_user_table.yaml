databaseChangeLog:
  - changeSet:
      id: 1-create-users-table
      author: Roshan Nepal
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: created_by
                  type: VARCHAR(255)

              - column:
                  name: created_at
                  type: TIMESTAMP

              - column:
                  name: updated_by
                  type: VARCHAR(255)

              - column:
                  name: updated_at
                  type: TIMESTAMP