databaseChangeLog:
  - changeSet:
      id: create-messages-table
      author: Roshan Nepal
      changes:
        - createTable:
            tableName: messages
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_messages
                    nullable: false

              - column:
                  name: conversation_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: content
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: source_chunks
                  type: UUID[]

              - column:
                  name: tokens_used
                  type: INT

              - column:
                  name: model_used
                  type: VARCHAR(100)

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: messages
            baseColumnNames: conversation_id
            referencedTableName: conversations
            referencedColumnNames: id
            constraintName: fk_messages_conversation
            onDelete: CASCADE