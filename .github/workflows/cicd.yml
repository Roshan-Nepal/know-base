name: Know Base CI/CD Pipeline
on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref}}
  cancel-in-progress: true

jobs:
  #############################
  # Job 1: Build and test    #
  ############################
  build-and-test:
    runs-on: ubuntu-latest
    env:
      SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      SPRING_PROFILES_ACTIVE: ${{ secrets.SPRING_PROFILES_ACTIVE }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: "maven"

      - name: Compile and Test All Modules
        run: ./mvnw clean verify

  ###############################
  # Build and Push Docker Image #
  ##############################
  build-and-push-docker:
    needs: build-and-test
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Layered Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Tags the image with both 'latest' and the specific Git commit hash for easy rollbacks
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/know-base-back:latest
            ${{ secrets.DOCKER_USERNAME }}/know-base-back:${{ github.sha }}


